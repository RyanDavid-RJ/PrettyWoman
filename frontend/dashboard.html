<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Tático - PowerSoccer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="tema.js"></script>
  </head>
  <body>
    <script>
      if (!localStorage.getItem("usuarioLogado")) window.location.href = "login.html";
    </script>

    <header class="duo-header" data-html2canvas-ignore="true">
      <div class="logo">
        <img src="./assets/img/logo.png" style="max-height: 45px; width: auto;" alt="Logo Cadeira">
        <img src="./assets/img/texto-ps.png" style="max-height: 25px; width: auto;" alt="Power Soccer">
      </div>
      <div class="header-actions">
        <a href="home.html" class="header-link">⬅ Menu Principal</a>
        <button id="btn-settings" class="btn-header-icon">⚙️</button>
      </div>
    </header>

    <div class="dashboard-container" id="area-relatorio">
      <div class="filtro-container" data-html2canvas-ignore="true">
        <h2>Análise <span class="cor-duo">Tática</span></h2>
        <div class="header-actions">
          <select id="seletor-partida" class="form-input"><option value="">Carregando partidas...</option></select>
          <button id="btn-exportar-pdf" class="btn-acao btn-duo-primary">📄 Gerar PDF</button>
        </div>
      </div>

      <div class="painel-ia">
        <h3 style="color: var(--duo-purple)">🤖 Síntese de Inteligência Tática</h3>
        <p id="texto-analise-ia">Aguardar processamento de dados da partida...</p>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card kpi-gols"><h3>⚽ Gols</h3><div class="valor" id="kpi-gols">0</div></div>
        <div class="kpi-card kpi-passes-c"><h3>✅ Passes Certos</h3><div class="valor" id="kpi-passes-c">0</div></div>
        <div class="kpi-card kpi-passes-e"><h3>❌ Passes Errados</h3><div class="valor" id="kpi-passes-e">0</div></div>
        <div class="kpi-card kpi-intercep"><h3>🛡️ Interceptações</h3><div class="valor" id="kpi-intercep">0</div></div>
      </div>

      <div class="visao-dupla">
        <div class="painel-grafico">
          <h3 class="label-modal text-center">Desempenho por Jogador</h3>
          <canvas id="graficoDesempenho"></canvas>
        </div>
        <div class="painel-heatmap">
          <h3 class="label-modal text-center">Mapa de Calor da Equipe</h3>
          
          <div class="filtros-heatmap" data-html2canvas-ignore="true">
            <button class="btn-filtro-hm ativo" data-filtro="Todos">Todos</button>
            <button class="btn-filtro-hm" data-filtro="Gol">Gols</button>
            <button class="btn-filtro-hm" data-filtro="Passe Certo">Passes Certos</button>
            <button class="btn-filtro-hm" data-filtro="Passe Errado">Passes Errados</button>
            <button class="btn-filtro-hm" data-filtro="Interceptação">Interceptações</button>
          </div>

          <div class="heatmap-container" id="campo-heatmap">
            <svg viewBox="0 0 800 500" width="100%" height="100%" style="position: absolute; z-index: 1">
              <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" rx="15" />
              <line x1="400" y1="20" x2="400" y2="480" stroke="rgba(255,255,255,0.5)" stroke-width="4" />
              <circle cx="400" cy="250" r="70" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" />
              <circle cx="400" cy="250" r="6" fill="rgba(255,255,255,0.5)" />
              <rect x="20" y="125" width="120" height="250" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" rx="10" />
              <rect x="660" y="125" width="120" height="250" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" rx="10" />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div id="modal-settings" class="escondido duo-modal modal-centralizado">
      <h4 class="modal-titulo-central">⚙️ Definições</h4>
      <div class="form-grupo">
        <label class="form-label">Aparência</label>
        <button id="toggle-tema" class="btn-acao btn-config">🌙 Modo Escuro Ativo</button>
      </div>
      <div class="form-grupo spacing-top">
        <label class="form-label">Acessibilidade</label>
        <button id="toggle-daltonismo" class="btn-acao btn-config">👁️ Modo Daltônico: Ligado</button>
      </div>
      <button id="fechar-settings" class="btn-cancelar spacing-top">Fechar</button>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
