<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Partidas - PowerScout</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="tema.js"></script>
  </head>
  <body>
    <header class="duo-header">
      <div class="logo"><span class="cor-duo">Power</span>Scout</div>
      <div class="header-actions">
        <a href="home.html" class="header-link">⬅ Menu Principal</a>
        <button id="btn-settings" class="btn-header-icon">⚙️</button>
      </div>
    </header>

    <div class="duo-container config-container">
      <h2>Histórico de <span class="cor-duo">Partidas</span></h2>
      <div id="lista-partidas" class="spacing-top">
        <p class="form-label text-center">Carregando partidas...</p>
      </div>
    </div>

    <div id="modal-settings" class="escondido duo-modal modal-centralizado">
      <h4 class="modal-titulo-central">⚙️ Definições</h4>
      <div class="form-grupo">
        <label class="form-label">Aparência</label>
        <button id="toggle-tema" class="btn-acao btn-config">🌙 Modo Escuro Ativo</button>
      </div>
      <div class="form-grupo spacing-top">
        <label class="form-label">Acessibilidade</label>
        <button id="toggle-daltonismo" class="btn-acao btn-config">👁️ Modo Daltônico: Desligado</button>
      </div>
      <button id="fechar-settings" class="btn-cancelar spacing-top">Fechar</button>
    </div>

    <script>
      fetch("http://localhost:3000/api/partidas")
        .then((res) => res.json())
        .then((partidas) => {
          const lista = document.getElementById("lista-partidas");
          lista.innerHTML = "";
          if (partidas.length === 0) return (lista.innerHTML = '<p class="form-label text-center">Nenhuma partida registrada ainda.</p>');

          partidas.forEach((p) => {
            const div = document.createElement("div"); div.classList.add("partida-card");
            const dataFormatada = new Date(p.data_jogo).toLocaleString("pt-BR");
            div.innerHTML = `<div><strong style="font-size: 18px; color: var(--text-main);">vs ${p.adversario}</strong><br><small class="form-label">📅 ${dataFormatada}</small></div><span style="font-size: 24px; color: var(--text-main);">▶</span>`;
            div.onclick = () => {
              if (!p.escalacao) return alert("Esta partida antiga não tem escalação salva. Crie uma nova para visualizar!");
              localStorage.setItem("partidaAtual", JSON.stringify({ id: p.id, adversario: p.adversario, escalacao: typeof p.escalacao === "string" ? JSON.parse(p.escalacao) : p.escalacao }));
              localStorage.setItem("modoVisualizacao", "true");
              window.location.href = "index.html";
            };
            lista.appendChild(div);
          });
        });
    </script>
  </body>
</html>
