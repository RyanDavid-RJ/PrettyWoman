<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Painel de Gestão - PowerSoccer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="tema.js"></script>
  </head>
  <body>
    <script>
      if (!localStorage.getItem("usuarioLogado")) window.location.href = "login.html";
    </script>

    <header class="duo-header">
      <div class="logo">
        <img src="./assets/img/logo.png" style="max-height: 45px; width: auto;" alt="Logo Cadeira">
        <img src="./assets/img/texto-ps.png" style="max-height: 25px; width: auto;" alt="Power Soccer">
      </div>
      <div class="header-actions">
        <a href="home.html" class="header-link">⬅ Menu Principal</a>
        <button id="btn-settings" class="btn-header-icon">⚙️</button>
      </div>
    </header>

    <div id="escudo-bloqueio" class="bloqueio-tela"></div>

    <div class="elenco-layout">
      <div>
        <h2>Nosso <span class="cor-duo">Elenco</span></h2>
        <div class="grid-jogadores spacing-top" id="grid-elenco">
          <p class="form-label">Carregando elenco...</p>
        </div>
      </div>

      <div class="duo-container">
        <h3 class="text-center">Cadastrar <span class="cor-duo">Atleta</span></h3>
        <form id="form-jogador" class="spacing-top">
          <div class="form-grupo">
            <label class="form-label">Nome do Atleta</label>
            <input type="text" id="nome-atleta" class="form-input" placeholder="Ex: Lucas" required />
          </div>
          <div class="form-grupo">
            <label class="form-label">Número da Camisa</label>
            <input type="number" id="numero-atleta" class="form-input" placeholder="Ex: 10" required />
          </div>
          <div class="form-grupo">
            <label class="form-label">Foto do Perfil (Opcional)</label>
            <input type="file" id="foto-atleta" class="form-input" accept="image/png, image/jpeg" />
          </div>
          <button type="submit" class="btn-acao btn-duo-primary" style="width: 100%;">Salvar Atleta</button>
        </form>
      </div>
    </div>

    <div id="modal-perfil-jogador" class="escondido duo-modal modal-perfil modal-centralizado" style="width: 90%; max-width: 800px;">
      <div class="perfil-header">
        <div id="perfil-foto" class="foto-grande" style="width: 100px; height: 100px; font-size: 40px"></div>
        <div style="text-align: left;">
          <h2 id="perfil-nome" style="margin-bottom: 5px">Nome</h2>
          <span id="perfil-camisa" style="background: var(--duo-green-primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold;">Camisa 00</span>
        </div>
      </div>

      <h3>📊 Raio-X de Média por Jogo</h3>
      <div class="perfil-kpis">
        <div class="kpi-mini"><h5>Média Gols</h5><div class="val" id="p-gols" style="color: var(--duo-yellow)">0.0</div></div>
        <div class="kpi-mini"><h5>Média Passes C.</h5><div class="val" id="p-passes-c" style="color: var(--duo-blue)">0.0</div></div>
        <div class="kpi-mini"><h5>Média Passes E.</h5><div class="val" id="p-passes-e" style="color: var(--duo-red)">0.0</div></div>
        <div class="kpi-mini"><h5>Média Intercep.</h5><div class="val" id="p-intercep" style="color: var(--duo-orange)">0.0</div></div>
      </div>

      <h3>📈 Gráfico de Evolução Temporal</h3>
      <div class="duo-card" style="background: var(--bg-primary); padding: 15px; margin-top: 15px;">
         <canvas id="graficoEvolucao" style="width: 100%; height: 250px;"></canvas>
      </div>

      <div class="header-actions spacing-top">
        <button id="btn-editar-atleta" class="btn-acao btn-duo-azul" style="flex: 1">✏️ Editar Jogador</button>
        <button id="fechar-perfil" class="btn-cancelar" style="flex: 1; margin: 0">Fechar Perfil</button>
      </div>
    </div>

    <div id="modal-editar-jogador" class="escondido duo-modal modal-centralizado" style="width: 340px; z-index: 1001;">
      <h4 class="modal-titulo-central">✏️ Editar Dados do Atleta</h4>
      <form id="form-editar-jogador" class="spacing-top">
        <div class="form-grupo">
          <label class="form-label">Nome do Atleta</label>
          <input type="text" id="edit-nome-atleta" class="form-input" required />
        </div>
        <div class="form-grupo">
          <label class="form-label">Número da Camisa</label>
          <input type="number" id="edit-numero-atleta" class="form-input" required />
        </div>
        <div class="form-grupo">
          <label class="form-label">Substituir Foto (Opcional)</label>
          <input type="file" id="edit-foto-atleta" class="form-input" accept="image/png, image/jpeg" />
        </div>
        <div class="modal-botoes-coluna" style="margin-top: 20px;">
          <button type="submit" class="btn-acao btn-duo-primary">Salvar Modificações</button>
          <button type="button" id="btn-cancelar-edicao-atleta" class="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </div>

    <div id="modal-confirm-custom" class="escondido duo-modal modal-centralizado">
      <h4 id="titulo-confirm-custom" style="color: var(--duo-orange)">Atenção</h4>
      <p id="texto-confirm-custom" class="texto-alerta"></p>
      <div class="modal-botoes-coluna">
        <button id="btn-sim-confirm" class="btn-acao btn-duo-orange">Sim</button>
        <button id="btn-nao-confirm" class="btn-cancelar">Cancelar</button>
      </div>
    </div>

    <div id="modal-settings" class="escondido duo-modal modal-centralizado">
      <h4 class="modal-titulo-central">⚙️ Definições</h4>
      <div class="form-grupo">
        <label class="form-label">Aparência</label>
        <button id="toggle-tema" class="btn-acao btn-config">🌙 Modo Escuro Ativo</button>
      </div>
      <div class="form-grupo spacing-top">
        <label class="form-label">Acessibilidade</label>
        <button id="toggle-daltonismo" class="btn-acao btn-config">👁️ Modo Daltônico: Desligado</button>
      </div>
      <button id="fechar-settings" class="btn-cancelar spacing-top">Fechar</button>
    </div>

    <script>
      let atletaAbertoId = null;
      let dadosAtletaAtualGlobal = {};
      let instanciarGraficoLinhas = null;

      function carregarElenco() {
        fetch("https://prettywoman.onrender.com/api/atletas")
          .then((res) => res.json())
          .then((atletas) => {
            const grid = document.getElementById("grid-elenco");
            grid.innerHTML = "";
            if (atletas.length === 0) return (grid.innerHTML = '<p class="form-label">Nenhum jogador cadastrado ainda.</p>');

            atletas.forEach((a) => {
              const card = document.createElement("div"); card.classList.add("card-atleta");
              let htmlFoto = a.foto ? `<div class="foto-grande" style="background-image: url('https://prettywoman.onrender.com${a.foto}'); background-size: cover; background-position: center; color:transparent;"></div>` : `<div class="foto-grande">${a.nome.charAt(0)}</div>`;
              card.innerHTML = `${htmlFoto} <h4 style="margin:0; color: var(--text-main);">${a.nome}</h4> <small class="form-label">Camisa ${a.numero_camisa}</small>`;
              card.onclick = () => abrirRaioX(a.id);
              grid.appendChild(card);
            });
          });
      }
      carregarElenco();

      document.getElementById("form-jogador").addEventListener("submit", function (e) {
          e.preventDefault();
          const btnSalvar = document.querySelector('#form-jogador button[type="submit"]');
          btnSalvar.textContent = "Salvando..."; btnSalvar.disabled = true;

          const formData = new FormData();
          formData.append("nome", document.getElementById("nome-atleta").value);
          formData.append("numero_camisa", document.getElementById("numero-atleta").value);
          const fotoInput = document.getElementById("foto-atleta");
          if (fotoInput.files.length > 0) formData.append("foto", fotoInput.files[0]);

          fetch("https://prettywoman.onrender.com/api/atletas", { method: "POST", body: formData })
            .then((res) => res.json()).then(() => {
              document.getElementById("form-jogador").reset();
              btnSalvar.textContent = "Salvar Atleta"; btnSalvar.disabled = false;
              carregarElenco();
            });
        });

      function abrirRaioX(id) {
        atletaAbertoId = id; 
        const escudo = document.getElementById("escudo-bloqueio"); 
        const modal = document.getElementById("modal-perfil-jogador");
        
        // 1. Coleta estatísticas básicas brutas e calcula as médias em tempo de execução
        Promise.all([
          fetch(`https://prettywoman.onrender.com/api/estatisticas/atleta/${id}`).then(res => res.json()),
          fetch(`https://prettywoman.onrender.com/api/eventos/atleta/${id}`).then(res => res.json())
        ]).then(([stats, lances]) => {
            dadosAtletaAtualGlobal = stats; // Armazena cache para preenchimento de modal
            
            document.getElementById("perfil-nome").textContent = stats.nome || "Desconhecido";
            document.getElementById("perfil-camisa").textContent = `Camisa ${stats.numero_camisa || "?"}`;
            
            const divFoto = document.getElementById("perfil-foto");
            if (stats.foto) { 
                divFoto.style.backgroundImage = `url('https://prettywoman.onrender.com${stats.foto}')`; 
                divFoto.style.backgroundSize = "cover"; 
                divFoto.style.backgroundPosition = "center"; 
                divFoto.style.color = "transparent"; 
            } else { 
                divFoto.style.backgroundImage = "none"; 
                divFoto.style.color = "white"; 
                divFoto.textContent = stats.nome ? stats.nome.charAt(0) : "?"; 
            }

            // Descobrir partidas únicas em que o jogador teve alguma ação registrada
            const partidasUnicas = [...new Set(lances.map(l => l.partida_id))];
            const qtdPartidas = partidasUnicas.length || 1;

            // Injetar médias divididas com precisão de 1 casa decimal
            document.getElementById("p-gols").textContent = ( (stats.gols || 0) / qtdPartidas ).toFixed(1);
            document.getElementById("p-passes-c").textContent = ( (stats.passes_certos || 0) / qtdPartidas ).toFixed(1);
            document.getElementById("p-passes-e").textContent = ( (stats.passes_errados || 0) / qtdPartidas ).toFixed(1);
            document.getElementById("p-intercep").textContent = ( (stats.interceptacoes || 0) / qtdPartidas ).toFixed(1);

            // 2. MONTAGEM DO GRÁFICO DE EVOLUÇÃO TEMPORAL (CHART.JS)
            // Agrupar ações por partida e gerar array de performance cronológico
            const historicoPartidasOrdenado = partidasUnicas.sort((a,b) => a - b);
            const dadosGols = []; const dadosPassesC = []; const dadosPassesE = []; const dadosIntercep = [];
            const labelsPartidas = [];

            historicoPartidasOrdenado.forEach((pId, index) => {
                labelsPartidas.push(`Jogo ${index + 1}`);
                const lancesDoJogo = lances.filter(l => l.partida_id === pId);
                
                dadosGols.push(lancesDoJogo.filter(l => l.tipo_acao === 'Gol').length);
                dadosPassesC.push(lancesDoJogo.filter(l => l.tipo_acao === 'Passe Certo').length);
                dadosPassesE.push(lancesDoJogo.filter(l => l.tipo_acao === 'Passe Errado').length);
                dadosIntercep.push(lancesDoJogo.filter(l => l.tipo_acao === 'Interceptação').length);
            });

            // Se o jogador nunca atuou, monta um esqueleto limpo
            if(partidasUnicas.length === 0) {
               labelsPartidas.push("Sem Jogos"); dadosGols.push(0); dadosPassesC.push(0); dadosPassesE.push(0); dadosIntercep.push(0);
            }

            const ctx = document.getElementById('graficoEvolucao').getContext('2d');
            if (instanciarGraficoLinhas) instanciarGraficoLinhas.destroy();

            instanciarGraficoLinhas = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelsPartidas,
                    datasets: [
                        { label: 'Gols', data: dadosGols, borderColor: '#FFC800', backgroundColor: 'transparent', tension: 0.2, borderWidth: 3 },
                        { label: 'Passes Certos', data: dadosPassesC, borderColor: '#1CB0F6', backgroundColor: 'transparent', tension: 0.2, borderWidth: 3 },
                        { label: 'Passes Errados', data: dadosPassesE, borderColor: '#FF4B4B', backgroundColor: 'transparent', tension: 0.2, borderWidth: 3 },
                        { label: 'Interceptações', data: dadosIntercep, borderColor: '#FF9600', backgroundColor: 'transparent', tension: 0.2, borderWidth: 3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#aaa', font: { family: 'Nunito', size: 11 } } } },
                    scales: {
                        y: { ticks: { color: '#aaa', stepSize: 1 }, grid: { color: '#444' } },
                        x: { ticks: { color: '#aaa' }, grid: { display: false } }
                    }
                }
            });

            escudo.classList.add("ativo"); modal.classList.remove("escondido");
        });
      }

      document.getElementById("fechar-perfil").onclick = () => { document.getElementById("escudo-bloqueio").classList.remove("ativo"); document.getElementById("modal-perfil-jogador").classList.add("escondido"); };

      // SISTEMA INTERATIVO DE EDIÇÃO DE ATLETA
      const modalEditarAtleta = document.getElementById("modal-editar-jogador");
      document.getElementById("btn-editar-atleta").onclick = () => {
          document.getElementById("edit-nome-atleta").value = dadosAtletaAtualGlobal.nome;
          document.getElementById("edit-numero-atleta").value = dadosAtletaAtualGlobal.numero_camisa;
          document.getElementById("edit-foto-atleta").value = ""; // Limpa campo de upload
          
          document.getElementById("modal-perfil-jogador").classList.add("escondido");
          modalEditarAtleta.classList.remove("escondido");
      };

      document.getElementById("btn-cancelar-edicao-atleta").onclick = () => {
          modalEditarAtleta.classList.add("escondido");
          document.getElementById("modal-perfil-jogador").classList.remove("escondido");
      };

      document.getElementById("form-editar-jogador").onsubmit = function(e) {
          e.preventDefault();
          const btnSubmit = modalEditarAtleta.querySelector('button[type="submit"]');
          btnSubmit.textContent = "Sincronizando..."; btnSubmit.disabled = true;

          const formEditData = new FormData();
          formEditData.append("nome", document.getElementById("edit-nome-atleta").value);
          formEditData.append("numero_camisa", document.getElementById("edit-numero-atleta").value);
          
          const fileInput = document.getElementById("edit-foto-atleta");
          if(fileInput.files.length > 0) formEditData.append("foto", fileInput.files[0]);

          fetch(`https://prettywoman.onrender.com/api/atletas/${atletaAbertoId}`, {
              method: "PUT",
              body: formEditData
          }).then(res => res.json()).then((data) => {
              btnSubmit.textContent = "Salvar Modificações"; btnSubmit.disabled = false;
              modalEditarAtleta.classList.add("escondido");
              document.getElementById("escudo-bloqueio").classList.remove("ativo");
              carregarElenco();
          });
      };
    </script>
  </body>
</html>
