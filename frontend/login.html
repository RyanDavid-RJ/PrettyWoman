<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Login - PowerSoccer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="tema.js"></script>
  </head>
  <body class="login-page">
    <div id="splash-screen" class="splash-screen">
      <div class="splash-logo">
        <img src="./assets/img/logo.png" style="max-height: 80px; width: auto;" alt="PowerSoccer Logo">
      </div>
      <div id="espaco-bonequinho" class="splash-loader"></div>
    </div>

    <button id="btn-settings" class="btn-flutuante">⚙️</button>

      <div class="login-box duo-card">
        <div class="logo-container">
          <img src="./assets/img/logo.png" style="max-height: 120px; width: auto;" alt="PowerSoccer Logo">
        </div>
        <p>Acesse o painel tático da equipe</p>

      <div class="flex-center">
        <div id="g_id_onload" data-client_id="435937929513-qdgtkv50f7hr96l3si189tmrd6p5okr5.apps.googleusercontent.com" data-context="signin" data-ux_mode="popup" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
      </div>

      <div id="mensagem-erro" class="texto-erro">E-mail não autorizado!</div>
      <button class="btn-dev" onclick="loginDesenvolvedor()">Login Rápido (Modo Dev)</button>
    </div>

    <div id="modal-settings" class="escondido duo-modal modal-centralizado">
      <h4 class="modal-titulo-central">⚙️ Definições</h4>
      <div class="form-grupo">
        <label class="form-label">Aparência</label>
        <button id="toggle-tema" class="btn-acao btn-config">🌙 Modo Escuro Ativo</button>
      </div>
      <div class="form-grupo spacing-top">
        <label class="form-label">Acessibilidade</label>
        <button id="toggle-daltonismo" class="btn-acao btn-config">👁️ Modo Daltônico: Desligado</button>
      </div>
      <button id="fechar-settings" class="btn-cancelar spacing-top">Fechar</button>
    </div>

    <script>
      function decodificarJWT(token) {
        const base64Url = token.split(".")[1]; const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(decodeURIComponent(atob(base64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")));
      }
      function handleCredentialResponse(response) {
        const dadosGoogle = decodificarJWT(response.credential);
        enviarParaBackend(dadosGoogle.email, dadosGoogle.name);
      }
      function loginDesenvolvedor() { enviarParaBackend("treinador@teste.com"); }
      function enviarParaBackend(emailUsuario, nomeUsuario) {
        const btnDev = document.querySelector('.btn-dev');
        const msgErro = document.getElementById('mensagem-erro');
        
        btnDev.textContent = "Conectando ao servidor (Pode levar até 50s)...";
        msgErro.style.display = "none";

        fetch("https://prettywoman.onrender.com/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailUsuario, nome: nomeUsuario }),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Erro na resposta do servidor");
            return res.json();
          })
          .then((data) => {
            if (data.sucesso) {
              localStorage.setItem("usuarioLogado", JSON.stringify(data.usuario));
              window.location.href = "home.html";
            }
          })
          .catch((erro) => {
            btnDev.textContent = "Login Rápido (Modo Dev)";
            msgErro.textContent = "Servidor acordando! Por favor, clique novamente.";
            msgErro.style.display = "block";
            console.error("Erro no login:", erro);
          });
      }
    </script>
  </body>
</html>
